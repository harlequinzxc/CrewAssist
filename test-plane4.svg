<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="leftWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE073" />
      <stop offset="100%" stop-color="#C9A227" />
    </linearGradient>
    <linearGradient id="rightWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C9A227" />
      <stop offset="100%" stop-color="#9C7714" />
    </linearGradient>
    <linearGradient id="tail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9C7714" />
      <stop offset="100%" stop-color="#59430A" />
    </linearGradient>
  </defs>

  <g transform="translate(10, 10)">
    <!-- Right wing -->
    <polygon points="450,50 250,450 210,280" fill="url(#rightWing)" />
    
    <!-- Left wing -->
    <polygon points="450,50 210,280 40,210" fill="url(#leftWing)" />
    
    <!-- Under belly / tail -->
    <polygon points="450,50 210,280 280,260" fill="url(#tail)" />
  </g>
</svg>
