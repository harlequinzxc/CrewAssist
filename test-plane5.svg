<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE073" />
      <stop offset="100%" stop-color="#C9A227" />
    </linearGradient>
    <linearGradient id="right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C9A227" />
      <stop offset="100%" stop-color="#9C7714" />
    </linearGradient>
    <linearGradient id="tail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80610F" />
      <stop offset="100%" stop-color="#59430A" />
    </linearGradient>
  </defs>

  <g transform="translate(0, -10)">
    <!-- Right wing -->
    <polygon points="210,290 460,50 290,460" fill="url(#right)" />
    
    <!-- Tail (Flap dropping down) -->
    <polygon points="210,290 290,460 210,380" fill="url(#tail)" />
    
    <!-- Left wing -->
    <polygon points="50,230 460,50 210,290" fill="url(#left)" />
  </g>
</svg>
