<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="wingRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE073" />
      <stop offset="100%" stop-color="#D6AD2A" />
    </linearGradient>
    <linearGradient id="wingLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D6AD2A" />
      <stop offset="100%" stop-color="#A5841D" />
    </linearGradient>
    <linearGradient id="tail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5841D" />
      <stop offset="100%" stop-color="#6F5812" />
    </linearGradient>
  </defs>

  <g transform="rotate(-15, 256, 256) translate(20, -20)">
    <!-- Main Right Wing -->
    <polygon points="460,50 250,430 200,260" fill="url(#wingRight)" />
    <!-- Main Left Wing -->
    <polygon points="460,50 200,260 50,190" fill="url(#wingLeft)" />
    <!-- Folded under part -->
    <polygon points="460,50 200,260 210,340" fill="url(#tail)" />
  </g>
</svg>
