<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Drop Shadow for 3D pop -->
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="3" dy="10" stdDeviation="10" flood-color="#04070F" flood-opacity="0.3"/>
    </filter>

    <!-- Gradients for the purely gold plane -->
    <linearGradient id="leftWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE073" />
      <stop offset="100%" stop-color="#C9A227" />
    </linearGradient>

    <linearGradient id="rightWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C9A227" />
      <stop offset="100%" stop-color="#9C7714" />
    </linearGradient>

    <linearGradient id="tail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80610F" />
      <stop offset="100%" stop-color="#4A3606" />
    </linearGradient>
  </defs>

  <g filter="url(#shadow)" transform="translate(64, 64) scale(0.75)">
    <!-- Right wing -->
    <polygon points="210,290 460,40 280,440" fill="url(#rightWing)" />
    
    <!-- Tail (Flap dropping down) -->
    <polygon points="210,290 280,440 210,380" fill="url(#tail)" />
    
    <!-- Left wing -->
    <polygon points="40,240 460,40 210,290" fill="url(#leftWing)" />
  </g>
</svg>
