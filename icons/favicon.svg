<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Right Wing (Top/Peeking) -->
    <linearGradient id="rightWingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAC14D"/>
      <stop offset="100%" stop-color="#C29623"/>
    </linearGradient>

    <!-- Left Wing (Main Face) -->
    <linearGradient id="leftWingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE073"/>
      <stop offset="40%" stop-color="#F2CB40"/>
      <stop offset="100%" stop-color="#C9A227"/>
    </linearGradient>

    <!-- Fuselage (Bottom Face) -->
    <linearGradient id="fuseGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C520E"/>
      <stop offset="40%" stop-color="#9C7012"/>
      <stop offset="100%" stop-color="#C9A227"/>
    </linearGradient>
  </defs>

  <g transform="translate(6, -6)">
    <!-- Right Wing -->
    <polygon points="10,160 180,60 490,260" fill="url(#rightWingGrad)" />
    
    <!-- Left Wing -->
    <polygon points="10,160 180,310 490,260" fill="url(#leftWingGrad)" />
    
    <!-- Fuselage -->
    <polygon points="180,310 140,480 490,260" fill="url(#fuseGrad)" />
  </g>
</svg>
