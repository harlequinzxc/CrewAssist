<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CrewAssist</title>
    
    <!-- PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#04070F">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
    <link rel="apple-touch-icon" href="icons/icon-192.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        sia: {
                            gold: '#C9A227',
                            goldlt: '#E8C766',
                            navy: '#0B1A3A',
                            deep: '#04070F',
                            batik: '#5B3E96'
                        }
                    },
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        mono: ['"Space Mono"', 'monospace'],
                    }
                }
            }
        }
    </script>

    <style>
        :root {
            /* Dark Mode Variables */
            --bg-color: #04070F;
            --text-main: #FFFFFF;
            --text-muted: #9CA3AF;
            --glass-bg: rgba(11, 26, 58, 0.4);
            --glass-border: rgba(255, 255, 255, 0.05);
            --glass-bubble-bg: rgba(201, 162, 39, 0.15);
            --glass-sheet-bg: rgba(4, 7, 15, 0.95);
            --aurora-opacity: 1;
        }

        html:not(.dark) {
            /* Light Mode Variables */
            --bg-color: #F6F1E8;
            --text-main: #111827;
            --text-muted: #4B5563;
            --glass-bg: rgba(255, 255, 255, 0.6);
            --glass-border: rgba(0, 0, 0, 0.1);
            --glass-bubble-bg: rgba(201, 162, 39, 0.2);
            --glass-sheet-bg: rgba(246, 241, 232, 0.95);
            --aurora-opacity: 0.3;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            transition: background-color 0.3s ease, color 0.3s ease;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* Glassmorphic Utilities */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }

        .glass-bubble {
            background: var(--glass-bubble-bg);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid var(--glass-border);
        }

        .glass-sheet {
            background: var(--glass-sheet-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--glass-border);
        }

        /* Custom Glowing Elements */
        .glow-gold {
            box-shadow: 0 0 15px rgba(201, 162, 39, 0.3);
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .mask-edge {
            mask-image: linear-gradient(to right, black 85%, transparent 100%);
            -webkit-mask-image: linear-gradient(to right, black 85%, transparent 100%);
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
            100% { transform: translateY(0px); }
        }
        .animate-float {
            animation: float 4s ease-in-out infinite;
        }

        @keyframes jump {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }
        .animate-jump {
            animation: jump 2s infinite;
        }

        #sky-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
        }
        
        /* Unified UI input styles */
        .ui-input {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
        }
        html:not(.dark) .ui-input {
            background: rgba(0,0,0,0.03);
            border: 1px solid rgba(0,0,0,0.1);
        }
    </style>
</head>
<body class="antialiased w-full h-full min-h-screen flex flex-col">
    <!-- Starry Sky Background -->
    <canvas id="sky-canvas"></canvas>

    <div id="app-root" class="relative z-10 w-full h-full flex flex-col min-h-screen">
        <!-- Onboarding View -->
        <div id="onboarding-view" class="fixed inset-0 z-40 flex flex-col hidden">
            <div class="h-[35%] flex items-center justify-center relative">
                <div class="flex flex-col items-center">
                    <div class="mb-5 animate-float">
                        <img src="icons/icon-192.png" class="w-16 h-16 drop-shadow-2xl" alt="Plane">
                    </div>
                    <span class="text-[10px] uppercase tracking-[0.25em] font-bold text-sia-gold">CrewAssist&trade;</span>
                </div>
            </div>
            <div class="h-[65%] relative z-10 w-full backdrop-blur-sm">
                <!-- Curve Separator -->
                <div class="absolute -top-[40px] left-0 w-full h-[40px] overflow-hidden pointer-events-none">
                    <svg viewBox="0 0 100 40" preserveAspectRatio="none" class="absolute bottom-0 w-full h-[40px]">
                        <defs>
                            <linearGradient id="archGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                                <stop offset="0%" stop-color="#C9A227" stop-opacity="0" />
                                <stop offset="50%" stop-color="#C9A227" stop-opacity="1" />
                                <stop offset="100%" stop-color="#C9A227" stop-opacity="0" />
                            </linearGradient>
                        </defs>
                        <!-- Main Background (Transparent Glass) -->
                        <path d="M0,40 Q50,-10 100,40 L100,40 L0,40 Z" class="fill-[#F6F1E8]/90 dark:fill-[#080B14]/80" />
                        <!-- Gold Border Line (Tapered) -->
                        <path d="M0,40 Q50,-10 100,40" fill="none" stroke="url(#archGrad)" stroke-width="1.5" vector-effect="non-scaling-stroke" class="opacity-60" />
                    </svg>
                </div>
                <!-- Form Container -->
                <div class="bg-[#F6F1E8]/90 dark:bg-[#080B14]/80 h-full w-full px-8 pt-2 pb-8 flex flex-col">
                    <div class="flex-grow overflow-y-auto max-w-sm mx-auto w-full flex flex-col">
                        <h2 class="text-2xl font-bold mb-8 text-center">Welcome aboard<span class="text-sia-gold">.</span></h2>
                        <div class="space-y-6 flex-grow">
                            <!-- Name -->
                            <div>
                                <label class="block text-sm font-bold mb-2">Name</label>
                                <div class="relative">
                                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                        <i data-lucide="user" class="w-4 h-4 text-gray-400"></i>
                                    </div>
                                    <input type="text" id="ob-name" class="w-full ui-input rounded-xl py-3 pl-10 pr-4 text-sm font-bold focus:outline-none focus:border-sia-gold focus:ring-1 focus:ring-sia-gold transition-colors bg-transparent" placeholder="e.g. Johnathan">
                                </div>
                            </div>
                            <!-- Gender -->
                            <div>
                                <label class="block text-sm font-bold mb-2">Gender</label>
                                <div class="flex gap-3">
                                    <button class="flex-1 py-3 px-4 rounded-xl text-sm font-bold ui-input text-gray-400 ob-gender-btn flex items-center justify-center gap-2 transition-all" data-value="M">
                                        <i data-lucide="user" class="w-4 h-4"></i> Male
                                    </button>
                                    <button class="flex-1 py-3 px-4 rounded-xl text-sm font-bold ui-input text-gray-400 ob-gender-btn flex items-center justify-center gap-2 transition-all" data-value="F">
                                        <i data-lucide="user" class="w-4 h-4"></i> Female
                                    </button>
                                </div>
                            </div>
                            <!-- Rank -->
                            <div id="ob-rank-container" class="opacity-50 pointer-events-none transition-opacity hidden">
                                <label class="block text-sm font-bold mb-2">Rank</label>
                                <div class="flex flex-wrap gap-2" id="ob-rank-list">
                                    <!-- Rendered via JS -->
                                </div>
                            </div>
                        </div>
                        <div class="mt-8 shrink-0 pb-4">
                            <button id="ob-submit" disabled class="w-full py-3.5 px-4 rounded-full text-sm font-bold bg-gradient-to-r from-sia-goldlt to-sia-gold text-black disabled:opacity-50 disabled:grayscale transition-all shadow-[0_0_20px_rgba(201,162,39,0.2)] flex items-center justify-center gap-2 hover:shadow-[0_0_25px_rgba(201,162,39,0.4)]">
                                Let's Go <i data-lucide="arrow-right" class="w-4 h-4"></i>
                            </button>
                            <p class="text-[11px] text-center text-gray-500 mt-5 flex items-center justify-center gap-1.5 font-medium">
                                <i data-lucide="lock" class="w-3 h-3"></i> Data is stored locally on the device
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main View -->
        <div id="main-view" class="fixed inset-0 z-10 flex flex-col hidden">
            <!-- Header -->
            <header class="glass-panel z-30 shrink-0 sticky top-0 w-full relative">
                <div class="flex items-center justify-between px-4 py-3 w-full">
                    <!-- Left -->
                    <div class="flex items-center gap-2 cursor-pointer select-none" id="header-brand">
                        <img src="icons/icon-192.png" class="w-8 h-8 drop-shadow-md" alt="Logo">
                        <h1 class="font-bold text-lg tracking-tight">CrewAssist</h1>
                        <div class="w-2 h-2 rounded-full bg-green-500 animate-pulse ml-1"></div>
                    </div>
                    <!-- Right -->
                    <div class="flex items-center gap-2">
                        <button id="btn-theme" class="p-2 rounded-full hover:bg-black/5 dark:hover:bg-white/5 transition-colors text-gray-600 dark:text-gray-300">
                            <i data-lucide="moon" class="w-5 h-5 hidden dark:block"></i>
                            <i data-lucide="sun" class="w-5 h-5 block dark:hidden"></i>
                        </button>
                        <button id="btn-settings" class="p-2 rounded-full hover:bg-black/5 dark:hover:bg-white/5 transition-colors text-gray-600 dark:text-gray-300">
                            <i data-lucide="settings" class="w-5 h-5"></i>
                        </button>
                        <button id="btn-reset" class="p-2 rounded-full hover:bg-black/5 dark:hover:bg-white/5 transition-colors text-gray-600 dark:text-gray-300">
                            <i data-lucide="rotate-cw" class="w-5 h-5"></i>
                        </button>
                    </div>
                </div>
                <!-- Batik Accent Line -->
                <div class="h-[2px] w-full bg-gradient-to-r from-sia-batik via-sia-gold to-sia-batik opacity-80"></div>
            </header>

            <!-- Chat Area -->
            <main class="flex-grow overflow-y-auto relative p-4 max-w-xl mx-auto w-full pb-36 no-scrollbar" id="chat-container">
                <!-- Messages injected here via JS -->
            </main>

            <!-- Input Area -->
            <div class="fixed bottom-0 inset-x-0 pt-10 pb-6 px-4 z-20 pointer-events-none">
                <div class="absolute inset-0 bg-gradient-to-t from-[#F6F1E8] via-[#F6F1E8] to-transparent dark:from-[#04070F] dark:via-[#04070F]/90 dark:to-transparent"></div>
                <div class="max-w-xl mx-auto w-full flex flex-col gap-3 relative pointer-events-auto">
                    
                    <!-- Quick Action Chips -->
                    <div class="flex overflow-x-auto gap-2 no-scrollbar pb-1 pr-8 relative mask-edge" id="chip-container">
                        <button class="action-chip shrink-0 glass-panel rounded-full px-4 py-2.5 text-xs font-bold whitespace-nowrap transition-colors hover:bg-sia-gold/20" data-intent="total">
                            💰 Calculate total allowance
                        </button>
                        <button class="action-chip shrink-0 glass-panel rounded-full px-4 py-2.5 text-xs font-bold whitespace-nowrap transition-colors hover:bg-sia-gold/20" data-intent="menu">
                            🍴 What are we serving onboard
                        </button>
                        <button class="action-chip shrink-0 glass-panel rounded-full px-4 py-2.5 text-xs font-bold whitespace-nowrap transition-colors hover:bg-sia-gold/20" data-intent="print">
                            🖨️ Print the menu
                        </button>
                    </div>

                    <!-- Chat Input -->
                    <div class="glass-panel rounded-full flex items-center px-4 py-2 gap-2 shadow-[0_4px_30px_rgba(0,0,0,0.15)] bg-white/70 dark:bg-[#0b1a3a]/60">
                        <input type="text" id="chat-input" placeholder="Allowance, menu, print..." class="flex-grow bg-transparent border-none focus:outline-none text-sm font-bold placeholder-gray-500 dark:placeholder-gray-400">
                        <button id="btn-send" class="w-9 h-9 rounded-full bg-gradient-to-r from-sia-goldlt to-sia-gold text-black flex items-center justify-center shrink-0 shadow-md hover:shadow-lg transition-shadow active:scale-95">
                            <i data-lucide="send" class="w-4 h-4 ml-0.5"></i>
                        </button>
                    </div>

                </div>
            </div>
        </div>

        <!-- Cabin Shutter Animation Layer -->
        <div id="cabin-shutter" class="fixed inset-x-0 top-0 h-0 bg-[#E5E0D8] dark:bg-[#1A1F2E] z-50 overflow-hidden flex items-end justify-center transition-all duration-500 ease-in-out shadow-2xl pointer-events-none">
            <div class="w-full h-8 bg-[#D5D0C8] dark:bg-[#111520] rounded-b-xl flex items-center justify-center shadow-inner border-b border-black/10 dark:border-white/5">
                <div class="w-16 h-1.5 rounded-full bg-black/20 dark:bg-white/20"></div>
            </div>
        </div>

        <!-- Settings Bottom Sheet -->
        <div id="settings-backdrop" class="fixed inset-0 bg-black/60 z-40 hidden opacity-0 transition-opacity duration-300 backdrop-blur-sm"></div>
        <div id="settings-sheet" class="fixed inset-x-0 bottom-0 z-50 glass-sheet rounded-t-3xl translate-y-full transition-transform duration-300 flex flex-col max-h-[calc(100dvh-64px)]">
            <div class="w-full flex justify-center py-3 shrink-0">
                <div class="w-8 h-1.5 rounded-full bg-gray-400 dark:bg-gray-600"></div>
            </div>
            <div class="px-6 pb-8 overflow-y-auto max-w-xl mx-auto w-full space-y-6">
                <!-- Settings Content... -->
                <div class="flex items-center justify-between">
                    <h3 class="text-xl font-bold">Settings</h3>
                    <button id="btn-close-settings" class="p-2 rounded-full hover:bg-black/5 dark:hover:bg-white/5 transition-colors">
                        <i data-lucide="x" class="w-5 h-5"></i>
                    </button>
                </div>
                
                <!-- Profile -->
                <div>
                    <p class="text-[10px] text-gray-500 font-bold uppercase tracking-widest mb-2 px-1">Profile</p>
                    <div class="glass-panel rounded-2xl p-4 flex items-center justify-between shadow-sm border dark:border-white/5">
                        <div class="flex items-center gap-2.5">
                            <div class="w-8 h-8 rounded-full bg-black/5 dark:bg-white/5 flex items-center justify-center">
                                <i data-lucide="user-round" class="w-4 h-4 text-gray-600 dark:text-gray-300"></i>
                            </div>
                            <p class="font-bold text-base" id="settings-profile-name">Johnathan</p>
                        </div>
                        <button id="btn-edit-profile" class="px-5 py-1.5 rounded-full text-xs font-bold border border-sia-gold text-sia-gold hover:bg-sia-gold/10 transition-colors">Edit</button>
                    </div>
                </div>

                <!-- Preferences -->
                <div>
                    <p class="text-[10px] text-gray-500 font-bold uppercase tracking-widest mb-2 px-1">Preferences</p>
                    <div class="glass-panel rounded-2xl p-4 flex items-center justify-between shadow-sm border dark:border-white/5">
                        <div class="flex flex-col">
                            <span class="text-sm font-bold">Auto-scroll Chat</span>
                            <p class="text-[10px] text-gray-500 mt-1 flex items-center gap-1 font-medium">
                                <i data-lucide="arrow-down-to-line" class="w-3 h-3"></i> Jump to newest message
                            </p>
                        </div>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" id="toggle-autoscroll" class="sr-only peer" checked>
                            <div class="w-11 h-6 bg-gray-300 dark:bg-[#1a2030] peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-sia-gold border border-black/10 dark:border-white/10"></div>
                        </label>
                    </div>
                </div>

                <!-- Developer Section -->
                <div id="settings-developer" class="hidden">
                    <p class="text-[10px] text-[#ff4c4c] font-bold uppercase tracking-widest mb-2 px-1 flex items-center gap-1">
                        <i data-lucide="terminal" class="w-3 h-3"></i> Developer Mode
                    </p>
                    <div class="glass-panel rounded-2xl p-4 flex flex-col gap-3 shadow-sm border dark:border-white/5">
                        <span class="text-sm font-bold">Modifiers & Values</span>
                        <textarea id="dev-modifiers-json" class="w-full h-32 bg-black/5 dark:bg-[#04070F] border border-gray-300 dark:border-gray-700/50 rounded-xl p-3 text-xs font-mono focus:outline-none focus:border-sia-gold resize-none" placeholder="{}"></textarea>
                        <div class="flex gap-2">
                            <button id="btn-dev-save" class="flex-1 py-2 px-3 rounded-full text-xs font-bold bg-green-500/10 text-green-600 dark:text-[#4ade80] border border-green-500/20 hover:bg-green-500/20 transition-colors">Save</button>
                            <button id="btn-dev-export" class="flex-1 py-2 px-3 rounded-full text-xs font-bold bg-blue-500/10 text-blue-600 dark:text-[#60a5fa] border border-blue-500/20 hover:bg-blue-500/20 transition-colors">Export</button>
                            <button id="btn-dev-import" class="flex-1 py-2 px-3 rounded-full text-xs font-bold bg-purple-500/10 text-purple-600 dark:text-[#c084fc] border border-purple-500/20 hover:bg-purple-500/20 transition-colors relative overflow-hidden">
                                Import
                                <input type="file" id="dev-file-import" class="absolute inset-0 opacity-0 cursor-pointer" accept=".json">
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Data -->
                <div>
                    <p class="text-[10px] text-gray-500 font-bold uppercase tracking-widest mb-2 px-1">Data Management</p>
                    <button id="btn-clear-data" class="w-full py-3 px-4 rounded-2xl text-sm font-bold bg-red-500/10 text-red-600 dark:text-[#ff4c4c] border border-red-500/20 hover:bg-red-500/20 transition-colors flex items-center justify-center gap-2">
                        <i data-lucide="trash-2" class="w-4 h-4"></i> Clear All Data
                    </button>
                </div>
            </div>
        </div>

        <!-- Results Overlay Sheet -->
        <div id="results-backdrop" class="fixed inset-0 bg-black/60 z-40 hidden opacity-0 transition-opacity duration-300 backdrop-blur-sm"></div>
        <div id="results-sheet" class="fixed inset-x-0 bottom-0 z-50 glass-sheet rounded-t-3xl translate-y-full transition-transform duration-300 flex flex-col max-h-[90vh]">
            <div class="w-full flex justify-center py-3 shrink-0">
                <div class="w-8 h-1.5 rounded-full bg-gray-400 dark:bg-gray-600"></div>
            </div>
            <div class="flex items-center justify-between px-6 pb-4 shrink-0 border-b border-black/5 dark:border-white/5">
                <h3 class="text-xl font-bold" id="results-title">Calculation Results</h3>
                <button id="btn-close-results" class="p-2 rounded-full hover:bg-black/5 dark:hover:bg-white/5 transition-colors">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div class="px-6 py-6 overflow-y-auto max-w-xl mx-auto w-full space-y-6 flex-grow" id="results-content">
                <!-- Injected via JS -->
            </div>
        </div>
    </div>

    <script>
        // Initialize Lucide Icons
        try {
            lucide.createIcons();
        } catch (e) {
            console.error('Lucide icons error', e);
        }

        // Sky Canvas Animation
        const canvas = document.getElementById('sky-canvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let stars = [];
        let shootingStars = [];
        let time = 0;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            const dpr = window.devicePixelRatio || 1;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
            initStars();
        }

        window.addEventListener('resize', resize);

        function initStars() {
            stars = [];
            const numStars = Math.floor((width * height) / 3000); // 150-300 range usually
            const actualNumStars = Math.max(150, Math.min(300, numStars));

            for (let i = 0; i < actualNumStars; i++) {
                const isGold = Math.random() < 0.18;
                let color;
                if (isGold) {
                    color = '#C9A227';
                } else {
                    color = Math.random() < 0.2 ? '#A6C8FF' : '#FFFFFF';
                }

                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 1.5 + 0.5,
                    color: color,
                    twinkleSpeed: Math.random() * 0.01 + 0.002, // even slower twinkle
                    twinkleAmp: Math.random() * 0.8 + 0.2,
                    driftX: 0,
                    driftY: Math.random() * 0.03 + 0.01, // extremely slow downward drift
                    phase: Math.random() * Math.PI * 2
                });
            }
        }

        function createShootingStar() {
            shootingStars.push({
                x: Math.random() * width,
                y: Math.random() * (height / 3), // starts higher but randomly inside the top third
                length: Math.random() * 80 + 40,
                speed: Math.random() * 1.5 + 0.5, // much slower
                angle: Math.PI / 4 + (Math.random() * 0.2 - 0.1),
                opacity: 1
            });
        }

        function drawAurora() {
            const isDark = document.documentElement.classList.contains('dark');
            if (!isDark) return; // Aurora less visible or disabled in light mode

            const breath = Math.sin(time * 0.02) * 0.2 + 0.8;
            const opacity = 0.4 * breath;

            // Batik Purple Aurora
            const grd1 = ctx.createRadialGradient(width * 0.3, height * 0.7, 0, width * 0.3, height * 0.7, width * 0.6);
            grd1.addColorStop(0, `rgba(91, 62, 150, ${opacity * 0.5})`);
            grd1.addColorStop(1, 'rgba(91, 62, 150, 0)');
            ctx.fillStyle = grd1;
            ctx.fillRect(0, 0, width, height);

            // Gold Aurora
            const grd2 = ctx.createRadialGradient(width * 0.7, height * 0.3, 0, width * 0.7, height * 0.3, width * 0.5);
            grd2.addColorStop(0, `rgba(201, 162, 39, ${opacity * 0.3})`);
            grd2.addColorStop(1, 'rgba(201, 162, 39, 0)');
            ctx.fillStyle = grd2;
            ctx.fillRect(0, 0, width, height);
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            const isDark = document.documentElement.classList.contains('dark');
            if (!isDark) {
                requestAnimationFrame(animate);
                return;
            }
            
            time++;

            drawAurora();

            // Draw Stars
            stars.forEach(star => {
                // Movement
                star.x += star.driftX;
                star.y += star.driftY;

                // Wrap around
                if (star.y > height) star.y = 0;
                if (star.x > width) star.x = 0;
                if (star.x < 0) star.x = width;

                // Twinkle
                const twinkle = Math.sin(time * star.twinkleSpeed + star.phase) * star.twinkleAmp;
                const opacity = Math.max(0.2, 1 - twinkle);

                ctx.globalAlpha = opacity;
                ctx.fillStyle = star.color;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;

            // Shooting Stars
            if (Math.random() < 0.005) { // Rare
                createShootingStar();
            }

            for (let i = shootingStars.length - 1; i >= 0; i--) {
                const ss = shootingStars[i];
                
                const grad = ctx.createLinearGradient(
                    ss.x, ss.y, 
                    ss.x - Math.cos(ss.angle) * ss.length, 
                    ss.y - Math.sin(ss.angle) * ss.length
                );
                grad.addColorStop(0, `rgba(201, 162, 39, ${ss.opacity})`);
                grad.addColorStop(1, 'rgba(201, 162, 39, 0)');

                ctx.beginPath();
                ctx.moveTo(ss.x, ss.y);
                ctx.lineTo(ss.x - Math.cos(ss.angle) * ss.length, ss.y - Math.sin(ss.angle) * ss.length);
                ctx.strokeStyle = grad;
                ctx.lineWidth = 2;
                ctx.stroke();

                ss.x += Math.cos(ss.angle) * ss.speed;
                ss.y += Math.sin(ss.angle) * ss.speed;
                ss.opacity -= 0.02;

                if (ss.opacity <= 0 || ss.y > height || ss.x > width) {
                    shootingStars.splice(i, 1);
                }
            }

            requestAnimationFrame(animate);
        }

            msgDiv.innerHTML = `
                <div class="w-8 h-8 rounded-full bg-sia-gold shrink-0 flex items-center justify-center shadow-md">
                    <img src="icons/icon-192.png" class="w-5 h-5 brightness-0 drop-shadow-sm" alt="Bot">
                </div>
                <div class="glass-panel p-4 rounded-2xl rounded-tl-none w-[calc(100%-44px)] shadow-lg border border-black/5 dark:border-white/5 animate-[pulse_0.3s_ease-out_1]">
                    <div class="flex items-center justify-between mb-4 pb-2 border-b border-black/5 dark:border-white/5">
                        <h3 class="font-bold text-sm text-sia-gold">COP Allowance Calculator</h3>
                    </div>
                    ${ifaHtml}
                    ${lmaHtml}
                    <button id="${id}-btn-calc" class="w-full py-3 rounded-xl text-sm font-bold bg-gradient-to-r from-sia-goldlt to-sia-gold text-black shadow-md hover:shadow-lg transition-all mt-2 active:scale-[0.98]">
                        Calculate
                    </button>
                </div>
            `;
            
            chatContainer.appendChild(msgDiv);
            
            // Wait a tick for DOM
            setTimeout(() => {
                lucide.createIcons();
                bindCalculatorEvents(id, mode);
                if (appPrefs.autoScroll) scrollToBottom();
            }, 10);
        }

        function bindCalculatorEvents(id, mode) {
            // IFA Binding
            if (mode === 'ifa' || mode === 'both') {
                const typeSel = document.getElementById(`${id}-flight-type`);
                const cntSel = document.getElementById(`${id}-sector-count`);
                
                const renderIfaSectors = () => {
                    const container = document.getElementById(`${id}-ifa-sectors`);
                    const count = parseInt(cntSel.value);
                    const isTurn = typeSel.value === 'Turnaround';
                    const is4 = count === 4;

                    // Visibility logic per 4.2
                    const showUS = !isTurn && !is4;
                    const showPax = !is4;

                    let html = '';
                    for (let i = 1; i <= count; i++) {
                        let label = i % 2 !== 0 ? 'Outbound from SG' : 'Inbound to SG';
                        if (is4 && !isTurn && i > 1) label = 'Station to Station';
                        if (is4 && !isTurn && i === 4) label = 'Inbound to SG';

                        html += `
                            <div class="p-3 bg-black/5 dark:bg-white/5 rounded-xl border border-black/5 dark:border-white/5">
                                <p class="text-[10px] uppercase font-bold text-gray-500 tracking-wider mb-2">Sector ${i} (${label})</p>
                                <input type="text" id="${id}-ifa-t${i}" class="ui-input w-full rounded-lg py-2 px-3 text-sm font-bold placeholder-gray-400 focus:border-sia-gold outline-none time-input" placeholder="Flight Time (HH:MM)">
                                
                                <div class="flex gap-4 mt-2 ${!showUS && !showPax ? 'hidden' : ''}">
                                    ${showUS ? `<label class="flex items-center gap-1.5 text-xs font-bold text-gray-500 cursor-pointer"><input type="checkbox" id="${id}-ifa-us${i}" class="accent-sia-gold"> Direct US</label>` : ''}
                                    ${showPax ? `<label class="flex items-center gap-1.5 text-xs font-bold text-gray-500 cursor-pointer"><input type="checkbox" id="${id}-ifa-px${i}" class="accent-sia-gold"> Paxing</label>` : ''}
                                </div>
                            </div>
                        `;
                    }
                    container.innerHTML = html;
                    bindTimeInputs();

                    // Hide LMA if Turnaround
                    if (mode === 'both') {
                        const lmaWrap = document.getElementById(`${id}-lma-wrap`);
                        if (isTurn) {
                            lmaWrap.classList.add('hidden');
                        } else {
                            lmaWrap.classList.remove('hidden');
                        }
                    }
                };

                typeSel.addEventListener('change', renderIfaSectors);
                cntSel.addEventListener('change', renderIfaSectors);
                renderIfaSectors();
            }

            // LMA Binding
            if (mode === 'lma' || mode === 'both') {
                const container = document.getElementById(`${id}-lma-sectors`);
                const btnAdd = document.getElementById(`${id}-btn-add-lma`);
                let lmaCount = 0;

                const addLmaSector = () => {
                    lmaCount++;
                    const idx = lmaCount;
                    const div = document.createElement('div');
                    div.className = 'p-3 bg-black/5 dark:bg-white/5 rounded-xl border border-black/5 dark:border-white/5 relative';
                    
                    const today = new Date().toISOString().split('T')[0];
                    let defaultArr = today;
                    let defaultDep = today;

                    if (idx > 1) {
                        // Cascading logic fallback (initial)
                        const prevDep = document.getElementById(`${id}-lma-d${idx-1}`).value;
                        if (prevDep) {
                            const d = new Date(prevDep);
                            d.setDate(d.getDate() + 1);
                            defaultArr = d.toISOString().split('T')[0];
                            d.setDate(d.getDate() + 1);
                            defaultDep = d.toISOString().split('T')[0];
                        }
                    } else {
                        const d = new Date();
                        d.setDate(d.getDate() + 2);
                        defaultDep = d.toISOString().split('T')[0];
                    }

                    div.innerHTML = `
                        ${idx > 1 ? `<button type="button" class="absolute top-2 right-2 text-red-500 hover:text-red-700 lma-remove-btn" data-idx="${idx}"><i data-lucide="x" class="w-4 h-4"></i></button>` : ''}
                        <div class="mb-3">
                            <label class="block text-[10px] uppercase font-bold text-gray-500 tracking-wider mb-1">Station IATA</label>
                            <input type="text" id="${id}-lma-iata${idx}" class="ui-input w-full rounded-lg py-2 px-3 text-sm font-bold uppercase focus:border-sia-gold outline-none" placeholder="e.g. LHR" maxlength="3">
                        </div>
                        <div class="grid grid-cols-2 gap-2 mb-2">
                            <div>
                                <label class="block text-[10px] uppercase font-bold text-gray-500 tracking-wider mb-1">Arrival Date</label>
                                <input type="date" id="${id}-lma-a${idx}" value="${defaultArr}" class="ui-input w-full rounded-lg py-2 px-3 text-xs font-bold focus:border-sia-gold outline-none date-cascade" data-idx="${idx}">
                            </div>
                            <div>
                                <label class="block text-[10px] uppercase font-bold text-gray-500 tracking-wider mb-1">Time</label>
                                <input type="text" id="${id}-lma-at${idx}" class="ui-input w-full rounded-lg py-2 px-3 text-xs font-bold focus:border-sia-gold outline-none time-input" placeholder="HH:MM">
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-[10px] uppercase font-bold text-gray-500 tracking-wider mb-1">Dep Date</label>
                                <input type="date" id="${id}-lma-d${idx}" value="${defaultDep}" class="ui-input w-full rounded-lg py-2 px-3 text-xs font-bold focus:border-sia-gold outline-none date-cascade-dep" data-idx="${idx}">
                            </div>
                            <div>
                                <label class="block text-[10px] uppercase font-bold text-gray-500 tracking-wider mb-1">Time</label>
                                <input type="text" id="${id}-lma-dt${idx}" class="ui-input w-full rounded-lg py-2 px-3 text-xs font-bold focus:border-sia-gold outline-none time-input" placeholder="HH:MM">
                            </div>
                        </div>
                    `;
                    container.appendChild(div);
                    lucide.createIcons();
                    bindTimeInputs();
                    
                    if (idx === 3) btnAdd.classList.add('hidden'); // max 3
                };

                addLmaSector(); // Default 1st station

                btnAdd.addEventListener('click', addLmaSector);

                // Event delegation for cascading dates
                container.addEventListener('change', (e) => {
                    if (e.target.classList.contains('date-cascade')) {
                        const idx = parseInt(e.target.dataset.idx);
                        const val = e.target.value;
                        if (!val) return;
                        
                        let d = new Date(val + "T00:00:00");
                        d.setDate(d.getDate() + 1);
                        
                        const dep = document.getElementById(`${id}-lma-d${idx}`);
                        if (dep) dep.value = d.toISOString().split('T')[0];

                        // Cascade forward if exists
                        for (let j = idx + 1; j <= lmaCount; j++) {
                            const arrNext = document.getElementById(`${id}-lma-a${j}`);
                            const depNext = document.getElementById(`${id}-lma-d${j}`);
                            if (arrNext && depNext) {
                                d.setDate(d.getDate() + 1);
                                arrNext.value = d.toISOString().split('T')[0];
                                d.setDate(d.getDate() + 1);
                                depNext.value = d.toISOString().split('T')[0];
                            }
                        }
                    }
                });

                container.addEventListener('click', (e) => {
                    const btn = e.target.closest('.lma-remove-btn');
                    if (btn) {
                        btn.parentElement.remove();
                        lmaCount--;
                        btnAdd.classList.remove('hidden');
                    }
                });
            }

            document.getElementById(`${id}-btn-calc`).addEventListener('click', () => {
                executeCalculation(id, mode);
            });
        }

        function bindTimeInputs() {
            document.querySelectorAll('.time-input').forEach(input => {
                // remove old listeners if any by cloning
                const newInp = input.cloneNode(true);
                input.parentNode.replaceChild(newInp, input);
                
                newInp.addEventListener('blur', (e) => {
                    let val = e.target.value.replace(/\D/g, '');
                    if (!val) return;
                    if (val.length === 3) {
                        val = '0' + val; // e.g. 720 -> 0720
                    } else if (val.length === 1 || val.length === 2) {
                        val = val.padStart(2, '0') + '00';
                    }
                    if (val.length === 4) {
                        val = val.slice(0, 2) + ':' + val.slice(2);
                    }
                    e.target.value = val;
                });
                
                newInp.addEventListener('input', (e) => {
                    let val = e.target.value.replace(/\D/g, '');
                    if (val.length > 4) val = val.slice(0, 4);
                    // Don't format with colon until blur to allow easy typing like 0720
                    e.target.value = val;
                });
            });
        }

        // --- MATH ENGINE (LOGIC.md) ---

        function parseDuration(str) {
            if (!str) return null;
            const match = str.match(/^(\d{1,2}):?(\d{2})$/);
            if (!match) return null;
            const h = parseInt(match[1]);
            const m = parseInt(match[2]);
            if (m > 59) return null;
            const hours = h + (m / 60);
            return hours > 0 ? hours : null;
        }

        function getLayoverMultiplier(sdp) {
            if (sdp <= 14) return 1.3;
            if (sdp <= 18) return 2.5;
            return 3.0;
        }

        function getTurnaroundMultiplier(totalSdp) {
            if (totalSdp <= 12) return 1.3;
            if (totalSdp <= 14) return 1.6;
            if (totalSdp <= 18) return 2.5;
            return 3.0;
        }

        function executeCalculation(id, mode) {
            let ifaTotal = 0;
            let lmaTotal = 0;
            let ifaDetails = [];
            let lmaDetails = [];
            let isTurnaround = false;
            
            // IFA
            if (mode === 'ifa' || mode === 'both') {
                const type = document.getElementById(`${id}-flight-type`).value;
                const count = parseInt(document.getElementById(`${id}-sector-count`).value);
                isTurnaround = type === 'Turnaround';
                const is4 = count === 4;

                const rankRate = IFA_CONFIG.baseRates[appProfile.rank] || 13.5;
                
                // Determine SG logic per 2.1
                const isSgArr = is4 
                    ? (isTurnaround ? [true, false, true, false] : [true, false, false, false])
                    : [true, false];
                
                let sectors = [];
                let tripSdp = 0;

                for (let i = 1; i <= count; i++) {
                    const tInp = document.getElementById(`${id}-ifa-t${i}`);
                    const usInp = document.getElementById(`${id}-ifa-us${i}`);
                    const pxInp = document.getElementById(`${id}-ifa-px${i}`);
                    
                    const hours = parseDuration(tInp.value);
                    if (hours !== null) {
                        const buffer = isSgArr[i-1] ? IFA_CONFIG.sgBuffer : IFA_CONFIG.stationBuffer;
                        const sdp = hours + buffer;
                        const px = pxInp ? pxInp.checked : false;
                        const us = usInp ? usInp.checked : false;
                        
                        sectors.push({ hours, sdp, paxing: px, directUs: us, isSg: isSgArr[i-1] });
                        if (!px) tripSdp += sdp;
                    } else {
                        sectors.push(null);
                    }
                }

                const sharedTurnMult = isTurnaround ? getTurnaroundMultiplier(tripSdp) : 0;
                
                sectors.forEach((sec, idx) => {
                    if (!sec) return;
                    
                    let mult = 0;
                    let logic = '';
                    if (sec.paxing) {
                        mult = IFA_CONFIG.paxingMultiplier;
                        logic = 'Paxing Override (SDP ignored)';
                    } else if (isTurnaround) {
                        mult = sharedTurnMult;
                        logic = `Turnaround Bracket (Total SDP ${tripSdp.toFixed(1)}h)`;
                    } else if (sec.directUs) {
                        mult = IFA_CONFIG.directUSMultiplier;
                        logic = 'Direct US Override';
                    } else {
                        mult = getLayoverMultiplier(sec.sdp);
                        logic = `Layover Bracket (SDP ${sec.sdp.toFixed(1)}h)`;
                    }
                    
                    const allowance = sec.hours * rankRate * mult;
                    ifaTotal += allowance;
                    
                    ifaDetails.push(`
                        <div class="mb-3 p-3 bg-black/5 dark:bg-white/5 rounded-xl border border-black/5 dark:border-white/5">
                            <div class="flex justify-between font-bold text-sm mb-1">
                                <span>Sector ${idx+1} ${sec.isSg ? '🛫 from SG' : '🛬 to SG/Other'}</span>
                                <span>$${allowance.toFixed(2)}</span>
                            </div>
                            <p class="text-[10px] text-gray-500 font-mono">${sec.hours.toFixed(2)}h × $${rankRate} × ${mult}x</p>
                            <p class="text-xs text-gray-600 dark:text-gray-400 mt-1">${logic}</p>
                        </div>
                    `);
                });

                // Bonus
                if (isTurnaround) {
                    const bonusCount = is4 ? 2 : 1;
                    const bonus = bonusCount * IFA_CONFIG.turnaroundBonusAmount;
                    ifaTotal += bonus;
                    ifaDetails.push(`
                        <div class="mb-3 p-3 bg-black/5 dark:bg-white/5 rounded-xl border border-black/5 dark:border-white/5">
                            <div class="flex justify-between font-bold text-sm">
                                <span>Turnaround Bonus (${bonusCount}x)</span>
                                <span>$${bonus.toFixed(2)}</span>
                            </div>
                        </div>
                    `);
                }
            }

            // LMA
            if ((mode === 'lma' || mode === 'both') && !isTurnaround) {
                // Find all active LMA blocks
                const container = document.getElementById(`${id}-lma-sectors`);
                const blocks = container.querySelectorAll('.ui-input.uppercase');
                
                blocks.forEach(inp => {
                    const idxStr = inp.id.match(/\d+$/)[0];
                    const iata = inp.value.trim().toUpperCase();
                    const aDate = document.getElementById(`${id}-lma-a${idxStr}`).value;
                    const aTime = document.getElementById(`${id}-lma-at${idxStr}`).value;
                    const dDate = document.getElementById(`${id}-lma-d${idxStr}`).value;
                    const dTime = document.getElementById(`${id}-lma-dt${idxStr}`).value;

                    if (!iata || !aDate || !dDate || !aTime || !dTime) return; // Incomplete

                    const region = IATA_TO_REGION[iata];
                    if (!region) {
                        lmaDetails.push(`<div class="text-red-500 text-xs mb-2">Unknown region for ${iata}. Skipping.</div>`);
                        return;
                    }
                    
                    const rates = REGION_RATES[region];
                    
                    // Date math safely per 6.7
                    const arrDt = new Date(aDate + 'T00:00:00');
                    const depDt = new Date(dDate + 'T00:00:00');
                    const msDiff = depDt.getTime() - arrDt.getTime();
                    const daysDiff = Math.round(msDiff / (1000 * 60 * 60 * 24));
                    
                    if (daysDiff < 0) return;
                    
                    const parseMins = (t) => {
                        const m = t.match(/^(\d{1,2}):(\d{2})$/);
                        if (!m) return -1;
                        return parseInt(m[1]) * 60 + parseInt(m[2]);
                    };
                    
                    const arrMins = parseMins(aTime);
                    const depMins = parseMins(dTime);
                    if (arrMins < 0 || depMins < 0) return;

                    // Windows
                    const bEnd = 8*60+30; const bStart = 7*60+30;
                    const lEnd = 13*60+30; const lStart = 12*60+30;
                    const dEnd = 20*60+30; const dStart = 19*60+30;

                    let bc=0, lc=0, dc=0;
                    
                    if (daysDiff === 0) {
                        if (arrMins <= bEnd && depMins >= bStart) bc++;
                        if (arrMins <= lEnd && depMins >= lStart) lc++;
                        if (arrMins <= dEnd && depMins >= dStart) dc++;
                    } else {
                        // Arrival Day
                        if (arrMins <= bEnd) bc++;
                        if (arrMins <= lEnd) lc++;
                        if (arrMins <= dEnd) dc++;
                        // Inter
                        if (daysDiff > 1) {
                            bc += (daysDiff - 1);
                            lc += (daysDiff - 1);
                            dc += (daysDiff - 1);
                        }
                        // Dep Day
                        if (depMins >= bStart) bc++;
                        if (depMins >= lStart) lc++;
                        if (depMins >= dStart) dc++;
                    }

                    const stationTotal = (bc * rates.b) + (lc * rates.l) + (dc * rates.d);
                    lmaTotal += stationTotal;

                    lmaDetails.push(`
                        <div class="mb-3 p-3 bg-black/5 dark:bg-white/5 rounded-xl border border-black/5 dark:border-white/5">
                            <div class="flex justify-between font-bold text-sm mb-2">
                                <span>${iata} (${region})</span>
                                <span>$${stationTotal.toFixed(2)}</span>
                            </div>
                            <div class="flex gap-2 text-xs font-bold text-gray-500">
                                ${bc > 0 ? `<span class="bg-orange-500/20 text-orange-600 dark:text-orange-400 px-2 py-0.5 rounded">B x${bc}</span>` : ''}
                                ${lc > 0 ? `<span class="bg-blue-500/20 text-blue-600 dark:text-blue-400 px-2 py-0.5 rounded">L x${lc}</span>` : ''}
                                ${dc > 0 ? `<span class="bg-purple-500/20 text-purple-600 dark:text-purple-400 px-2 py-0.5 rounded">D x${dc}</span>` : ''}
                                ${bc===0&&lc===0&&dc===0 ? '<span>No meals eligible</span>' : ''}
                            </div>
                        </div>
                    `);
                });
            }

            const grandTotal = ifaTotal + lmaTotal;
            showResultsOverlay(grandTotal, ifaTotal, lmaTotal, ifaDetails, lmaDetails, isTurnaround);
        }

        function showResultsOverlay(grandTotal, ifaTotal, lmaTotal, ifaDetails, lmaDetails, isTurnaround) {
            const backdrop = document.getElementById('results-backdrop');
            const sheet = document.getElementById('results-sheet');
            const content = document.getElementById('results-content');
            
            let html = `
                <div class="p-6 bg-gradient-to-r from-sia-goldlt to-sia-gold rounded-2xl text-black shadow-lg mb-6">
                    <p class="text-xs uppercase font-bold opacity-70 tracking-wider mb-1">Grand Total</p>
                    <p class="text-4xl font-bold font-mono">$${grandTotal.toFixed(2)}</p>
                </div>
            `;

            if (ifaDetails.length > 0) {
                html += `
                    <div>
                        <div class="flex justify-between items-center mb-3">
                            <h4 class="font-bold">IFA Breakdown</h4>
                            <span class="font-bold font-mono text-sia-gold">$${ifaTotal.toFixed(2)}</span>
                        </div>
                        ${ifaDetails.join('')}
                    </div>
                `;
            }

            if (isTurnaround) {
                html += `<div class="p-3 bg-red-500/10 text-red-600 dark:text-[#ff4c4c] text-xs font-bold rounded-xl border border-red-500/20 text-center">LMA is not eligible for Turnaround flights.</div>`;
            } else if (lmaDetails.length > 0) {
                html += `
                    <div class="mt-6 border-t border-black/5 dark:border-white/5 pt-6">
                        <div class="flex justify-between items-center mb-3">
                            <h4 class="font-bold">LMA Breakdown</h4>
                            <span class="font-bold font-mono text-sia-gold">$${lmaTotal.toFixed(2)}</span>
                        </div>
                        ${lmaDetails.join('')}
                    </div>
                `;
            }

            content.innerHTML = html;
            
            backdrop.classList.remove('hidden');
            setTimeout(() => {
                backdrop.classList.remove('opacity-0');
                sheet.classList.remove('translate-y-full');
            }, 10);
            
            // Post result message to chat
            let label = "Total IFA";
            if (ifaTotal > 0 && lmaTotal > 0) label = "COP Allowance";
            else if (lmaTotal > 0) label = "Total LMA";
            
            setTimeout(() => {
                addMessage('bot', `Here is your calculated ${label}: **$${grandTotal.toFixed(2)}**`);
            }, 600);
        }

        document.getElementById('btn-close-results').addEventListener('click', () => {
            const backdrop = document.getElementById('results-backdrop');
            const sheet = document.getElementById('results-sheet');
            
            backdrop.classList.add('opacity-0');
            sheet.classList.add('translate-y-full');
            
            setTimeout(() => {
                backdrop.classList.add('hidden');
            }, 300);
        });
    </script>
</body>
</html>
